[package]
name = "lambda-mcp-server"
version = "0.2.0"
edition = "2021"
description = "A production-ready lambda server providing local function as a service for LLMs via MCP"

[dependencies]
# Core async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# MCP Protocol
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP/API
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Runtime management
nix = { version = "0.27", features = ["process", "resource"] }

# IPC communication
inter-process-communication = "0.1"
nng = "1.0"  # For message passing

# Configuration
config = "0.13"
dotenv = "0.15"
dotenvy = "0.15"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Concurrency utilities
parking_lot = "0.12"
dashmap = "5.5"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Async trait
async-trait = "0.1"

# CPU count detection
num_cpus = "1.16"

# Text utilities
textwrap = "0.16"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
criterion = "0.5"

[[bench]]
name = "runtime_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
